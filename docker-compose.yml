version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "fru23junior01.05#"
      MYSQL_DATABASE: health_monitor
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  web:
    build: .
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "mysql+pymysql://root:fru23junior01.05#@db/health_monitor"
      SECRET_KEY: change-this-in-production
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: